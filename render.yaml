services:
  - type: web
    name: spicy-momento-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://aswin-uxd.github.io/spicy-momento/
      - key: MONGODB_URI
        sync: false
